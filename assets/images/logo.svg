<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Mantra Dhara — मन्त्र धारा">
  <defs>
    <!-- Deep crimson → maroon gradient for the medallion -->
    <radialGradient id="medallion-fill" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#8B2500"/>
      <stop offset="60%"  stop-color="#6B1A1A"/>
      <stop offset="100%" stop-color="#3D0C0C"/>
    </radialGradient>
    <!-- Gold shimmer for the Om and text -->
    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5D87A"/>
      <stop offset="50%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A07A10"/>
    </linearGradient>
    <!-- Saffron glow for sub-text -->
    <linearGradient id="saffron-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E55B00"/>
    </linearGradient>
    <!-- Flame outer glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3D0C0C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── Medallion (flame-leaf shape) ── -->
  <!-- Outer gold ring -->
  <ellipse cx="40" cy="40" rx="38" ry="38" fill="url(#gold-shimmer)" filter="url(#shadow)"/>
  <!-- Inner crimson disc -->
  <ellipse cx="40" cy="40" rx="33" ry="33" fill="url(#medallion-fill)"/>
  <!-- Thin gold inner ring -->
  <ellipse cx="40" cy="40" rx="33" ry="33" fill="none" stroke="#C9A227" stroke-width="1.2" opacity="0.6"/>
  <!-- Decorative petals (lotus-style) -->
  <g opacity="0.35" fill="#C9A227">
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(0  40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(45 40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(90 40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(135 40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(180 40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(225 40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(270 40 40)"/>
    <ellipse cx="40" cy="10" rx="3.5" ry="7" transform="rotate(315 40 40)"/>
  </g>

  <!-- ── ॐ symbol (main glyph) ── -->
  <text x="40" y="51"
    font-family="'Noto Serif Devanagari','Devanagari MT',serif"
    font-size="34"
    font-weight="700"
    text-anchor="middle"
    fill="url(#gold-shimmer)"
    filter="url(#glow)"
    letter-spacing="-1">ॐ</text>

  <!-- ── Site name — Devanagari ── -->
  <text x="96" y="32"
    font-family="'Noto Serif Devanagari','Devanagari MT',serif"
    font-size="22"
    font-weight="700"
    fill="url(#gold-shimmer)"
    letter-spacing="1">मन्त्र धारा</text>

  <!-- ── Site name — Latin ── -->
  <text x="97" y="52"
    font-family="'Noto Serif','Georgia',serif"
    font-size="13.5"
    font-weight="400"
    fill="url(#saffron-grad)"
    letter-spacing="2.5">MANTRA DHARA</text>

  <!-- ── Tagline ── -->
  <text x="97" y="68"
    font-family="-apple-system,'Segoe UI',sans-serif"
    font-size="10"
    font-weight="400"
    fill="#E8B87A"
    letter-spacing="0.5"
    opacity="0.85">Sacred Mantras &amp; Stotras · Odia · Hindi · English</text>

  <!-- ── Decorative horizontal line ── -->
  <line x1="96" y1="57" x2="310" y2="57" stroke="#C9A227" stroke-width="0.6" opacity="0.4"/>
</svg>

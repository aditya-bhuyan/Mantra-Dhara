<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mantra Dhara">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="#8B2500"/>
      <stop offset="55%"  stop-color="#6B1A1A"/>
      <stop offset="100%" stop-color="#3D0C0C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5D87A"/>
      <stop offset="50%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A07A10"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Gold outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#gold)"/>
  <!-- Crimson disc -->
  <circle cx="32" cy="32" r="27" fill="url(#bg)"/>
  <!-- Inner gold ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.55"/>

  <!-- 8 lotus petal hints -->
  <g opacity="0.3" fill="#C9A227">
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(0   32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(45  32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(90  32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(135 32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(180 32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(225 32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(270 32 32)"/>
    <ellipse cx="32" cy="7"  rx="2.8" ry="5.5" transform="rotate(315 32 32)"/>
  </g>

  <!-- ॐ glyph -->
  <text x="32" y="43"
    font-family="'Noto Serif Devanagari','Devanagari MT',serif"
    font-size="30"
    font-weight="700"
    text-anchor="middle"
    fill="url(#gold)"
    filter="url(#glow)">ॐ</text>
</svg>

# Netlify configuration for Mantra Dhara
# Jekyll is used as a static file copier only — no templates, no themes.
# Output goes to _site/ which Netlify publishes.

[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

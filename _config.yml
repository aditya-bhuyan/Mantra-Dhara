# Jekyll configuration for Mantra Dhara
# Used by Netlify's "bundle exec jekyll build" command.
# This is a pure static site — Jekyll acts as a passthrough copier only.

title: "मन्त्र धारा — Mantra Dhara"
description: "Daily Mantras and Slokas in Odia, Hindi and English"
url: ""
baseurl: ""

# No theme — we supply our own CSS/JS
theme: null

# Tell Jekyll not to process our JS/CSS through Liquid
keep_files:
  - assets

# Copy everything to _site as-is
include:
  - assets
  - "*.html"
  - "*.css"
  - "*.js"

exclude:
  - README.md
  - netlify.toml
  - Gemfile
  - Gemfile.lock
  - .git
